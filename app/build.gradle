plugins {
    id 'com.android.application'
}

def signingKeystorePath = System.getenv('SIGNING_KEYSTORE_PATH')
def signingKeystorePassword = System.getenv('SIGNING_KEYSTORE_PASSWORD')
def signingKeyAlias = System.getenv('SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('SIGNING_KEY_PASSWORD')
def hasReleaseSigning = signingKeystorePath && signingKeystorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace 'com.privacymask.xposed'
    compileSdk 37

    defaultConfig {
        applicationId 'com.privacymask.xposed'
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingKeystorePath)
                storePassword signingKeystorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // libxposed API 102 — compile-time only, the framework (Vector/LSPosed) supplies the
    // real implementation at runtime. Published on Maven Central.
    compileOnly 'io.github.libxposed:api:102.0.0'

    // libxposed Service 102 — used by MainActivity (this app's own process) to bind to the
    // framework and read/write remote preferences. Unlike the API above, this one does need
    // to ship inside the APK, hence 'implementation' rather than 'compileOnly'.
    implementation 'io.github.libxposed:service:102.0.0'

    // AppCompat + Material: MainActivity extends AppCompatActivity and the app theme is a
    // Material3 DayNight theme (see themes.xml).
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // androidx.core (WindowInsetsCompat/ViewCompat) + androidx.activity (EdgeToEdge helper)
    // for the edge-to-edge setup in MainActivity.onCreate().
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
}
