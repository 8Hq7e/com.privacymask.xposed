name: Build Signed PrivacyMask Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up current Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ""

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK 37.0
        run: |
          sdkmanager --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Add API 37 compatibility alias
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Validate signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "::error::Missing SIGNING_KEYSTORE_BASE64"; exit 1; }
          test -n "$SIGNING_KEYSTORE_PASSWORD" || { echo "::error::Missing SIGNING_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo "::error::Missing SIGNING_KEY_ALIAS"; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo "::error::Missing SIGNING_KEY_PASSWORD"; exit 1; }

      - name: Restore private signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/PrivacyMask-release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/PrivacyMask-release.jks" >> "$GITHUB_ENV"

      - name: Verify signing key
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$SIGNING_KEYSTORE_PATH" \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" > /dev/null

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Write APK checksum
        run: |
          sha256sum app/build/outputs/apk/release/app-release.apk \
            > app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyMask-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
